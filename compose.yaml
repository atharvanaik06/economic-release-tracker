name: macromonitor

services:
  api:
    build:
      context: .
    environment:
      MACROMONITOR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-macromonitor}:${POSTGRES_PASSWORD:-macromonitor}@postgres:5432/${POSTGRES_DB:-macromonitor}
      MACROMONITOR_ENVIRONMENT: development
      MACROMONITOR_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-macromonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-macromonitor}
      POSTGRES_USER: ${POSTGRES_USER:-macromonitor}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-macromonitor} -d ${POSTGRES_DB:-macromonitor}
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

